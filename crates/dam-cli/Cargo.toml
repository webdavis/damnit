[package]
name = "damnit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A local, git-shaped task and calendar store. Todoist and Google Calendar are remotes."

[[bin]]
name = "dam"
path = "src/main.rs"

[dependencies]
dam-domain = { path = "../dam-domain" }
dam-application = { path = "../dam-application" }
dam-adapters = { path = "../dam-adapters" }
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
jiff.workspace = true
toon-format.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
