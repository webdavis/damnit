[workspace]
resolver = "2"
members = [
  "crates/dam-domain",
  "crates/dam-application",
  "crates/dam-protocol",
  "crates/dam-adapters",
  "crates/dam-cli",
  "crates/dam-remote-todoist",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/webdavis/damnit"

[workspace.dependencies]
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde", "std"] }
toon-format = { version = "0.5", default-features = false }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2.189"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
getrandom = "0.3"
tempfile = "3"
